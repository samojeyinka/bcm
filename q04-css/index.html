<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive layout: sections A to H</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <h1 class="visually-hidden">Layout test</h1>
 
  <section class="card" id="a" aria-labelledby="a-h"><h2 id="a-h">A</h2><p>Section A spans two columns on desktop.</p></section>
  <section class="card" id="b" aria-labelledby="b-h"><h2 id="b-h">B</h2><p>Section B.</p></section>
  <section class="card" id="c" aria-labelledby="c-h"><h2 id="c-h">C</h2><p>Section C.</p></section>
  <section class="card" id="d" aria-labelledby="d-h"><h2 id="d-h">D</h2><p>Section D moves up to second place on mobile.</p></section>
  <section class="card" id="e" aria-labelledby="e-h"><h2 id="e-h">E</h2><p>Section E is hidden on mobile.</p></section>
  <section class="card" id="f" aria-labelledby="f-h"><h2 id="f-h">F</h2><p>Section F is hidden on mobile.</p></section>
  <section class="card" id="g" aria-labelledby="g-h"><h2 id="g-h">G</h2><p>Section G.</p></section>
  <section class="card" id="h" aria-labelledby="h-h"><h2 id="h-h">H</h2><p>Section H is hidden on mobile.</p></section>
</main>
</body>
</html>
